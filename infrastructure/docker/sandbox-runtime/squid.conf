http_port 3128
visible_hostname ldcn-sandbox-egress
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache deny all
pid_filename none
reply_body_max_size 512 MB all

acl SSL_ports port 443
acl CONNECT method CONNECT
acl blocked_ipv4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4
acl blocked_ipv6 dst ::1/128 fc00::/7 fe80::/10
acl approved_domains dstdomain \
  .npmjs.org \
  .repo.maven.apache.org .repo1.maven.org .services.gradle.org .plugins.gradle.org \
  .pypi.org .pythonhosted.org \
  .github.com .githubusercontent.com .gitlab.com .bitbucket.org

delay_pools 1
delay_class 1 2
delay_parameters 1 10485760/10485760 2097152/2097152
delay_access 1 allow approved_domains

http_access deny blocked_ipv4
http_access deny blocked_ipv6
http_access deny CONNECT !SSL_ports
http_access allow approved_domains
http_access deny all
