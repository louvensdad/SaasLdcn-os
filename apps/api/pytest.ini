[pytest]
# Markers for opt-in heavy tests. The default suite excludes `slow` so the normal
# development cycle stays fast; the Enterprise proof still exists and stays valid.
#
#   pytest               -> fast suite (excludes slow)
#   pytest -m slow       -> only the slow/Enterprise tests
#   pytest -m enterprise -> only the Enterprise-scale proof tests
markers =
    slow: long-running tests, excluded from the default suite (run with -m slow)
    enterprise: Enterprise-scale proof tests (>100k files); run with -m enterprise

addopts = -m "not slow"
