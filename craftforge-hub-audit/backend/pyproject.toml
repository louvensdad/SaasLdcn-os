[project]
name = "game-panel-backend"
version = "0.1.0"
description = "Painel SaaS multi-login para gerenciamento de contas de jogo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.14.0,<1.15.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.6.0,<2.7.0",
    "python-jose[cryptography]>=3.3.0,<3.4.0",
    "bcrypt>=4.1.0,<4.2.0",
    "loguru>=0.7.3,<0.8.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "sentry-sdk>=2.19.0,<2.20.0",
    "websockets>=14.0,<15.0",
]

[build-system]
requires = ["setuptools>=75.0,<76.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true